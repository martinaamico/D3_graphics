<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
	<title>GENES ANALYSIS</title>
    <!--VERSIONE 7 DI D3 PER GRAFICO AD ALBERO -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
	<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <link href='http://fonts.googleapis.com/css?family=Oswald:400,300,700' rel='stylesheet' type='text/css'>
	<link href='http://fonts.googleapis.com/css?family=Raleway' rel='stylesheet' type='text/css'>
    <link href="../frontend/style.css" rel='stylesheet'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

</head>
<body>
    <div class="header-container">
        <div class="title-section">
            <h1>GRAFICI RELAZIONALI E GERARCHICI TRA GENI</h1>
        </div>
        <div class="button-section">
            <button id="download-dataset" class="sideButton">Download Data Set</button>
        </div>
    </div>
    <div class="main-container">
        <div class="left-container">
            <h1>RELAZIONI PROTEICHE</h1>
            <h2>tra geni</h2>
            <div id="chord" class="chord"></div>
            <div id="speedControl" style="text-align: center; margin: 20px;">
                <label for="speedRange" style="margin-right: 10px;">Velocità rotazione:</label>
                <input type="range" id="speedRange" min="0.5" max="3" step="0.25" value="1">
                <span id="speedLabel">1x</span>
            </div>            
            <div class="buttons-container">
                <button id="skip" class="sideButton">SALTA INTRO</button>
                <button id="back" class="sideButton">INIETRO</button>
                <button id="playPause" class="sideButton">PLAY</button>
                <!--<button id="clicker" class="sideButton">LET'S START</button>-->
                <button id="advance" class="sideButton">AVANTI</button>
                <!--<button id="stop" style="display: none;">STOP</button>-->
                <button id="reset" class="sideButton ">RESETTA</button>
            </div>
        </div>

        <div class="right-container">
            <div id="tree-div">
                <h1>Divisione geni secondo Gene Ontology</h1> <!-- Titolo -->
                <div id="tree-chart" class="tree-chart"></div>
            </div>
            <div id="extra-div">
                <h2>Informazione gene specifico selezionato</h2>
                <div id="extra-info"class="extra-info"></div>
            </div>
        </div>
    </div>
    <script>
        let NameGene=[];
        let svg;
        let final=false; 
        let playPausePressed = false; // Variabile per tracciare se Play/Pausa è stato premuto
    </script>
    <script src="chord.js"></script>
    <script src="tree.js"></script>
    <script>
        async function downloadFolder() {
            const zip = new JSZip();
            const folder = zip.folder("file_json");
    
            // Lista dei file nella directory da includere nello ZIP
            const files = [
                "data_set_tree.json",
                "matrix.json",
                "names.json"
            ];
    
            // Aggiungi i file al folder ZIP
            for (const file of files) {
                const response = await fetch(`../file_json/${file}`);
                if (response.ok) {
                    const content = await response.text();
                    folder.file(file, content);
                } else {
                    console.error(`Errore nel caricamento del file: ${file}`);
                }
            }
    
            // Genera lo ZIP e scaricalo
            zip.generateAsync({ type: "blob" }).then(function (content) {
                saveAs(content, "file_json.zip");
            });
        }
    
        document.getElementById("download-dataset").addEventListener("click", downloadFolder);

        function triggerPause() {
            const playPauseButton = document.getElementById('playPause');
            if (playPauseButton) {
                console.log("Eseguo triggerPause");
                playPauseButton.click();
            } else {
                console.error("Bottone 'playPause' non trovato nel DOM.");
            }
        }

    </script>
    
    
    
</body>
